<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Chakras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Quicksand:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0b10;        /* the black */
    --soot: #18151d;       /* raised surfaces */
    --line: #2d2735;       /* quiet borders */
    --chalk: #f7f1ff;      /* text + sticker outlines */
    --fog: #a49bb5;        /* secondary text */
    --blush: #ff8fc0;      /* cheeks, little hearts */
    --glow: #b69cff;       /* current chakra color, set by JS */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ink);
    color: var(--chalk);
    font-family: "Quicksand", system-ui, sans-serif;
    font-weight: 600;
    overflow-x: hidden;
  }

  /* night sky */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(110% 55% at 50% 115%, color-mix(in srgb, var(--glow) 22%, transparent), transparent 65%), var(--ink);
    transition: background 1.2s ease; }
  .moon { position: fixed; top: max(22px, env(safe-area-inset-top)); right: 22px; width: 36px; z-index: 0; pointer-events: none;
    animation: rock 6s ease-in-out infinite; transform-origin: 70% 30%; }
  @keyframes rock { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  canvas#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  main { position: relative; z-index: 1; min-height: 100dvh; max-width: 460px; margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; }
  .screen { display: none; flex: 1; flex-direction: column; animation: pop .55s cubic-bezier(.3,1.5,.5,1); }
  .screen.on { display: flex; }
  @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }

  h1, h2 { font-family: "Grandstander", "Quicksand", sans-serif; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  h1 { font-size: clamp(56px, 17vw, 76px); line-height: .95; transform: rotate(-4deg); margin: 6px 0 12px;
    text-shadow: 3px 4px 0 var(--glow); }
  h1 span { display: inline-block; animation: wave 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * .13s); }
  @keyframes wave { 0%,60%,100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-10px) rotate(-6deg); } }
  h2 { font-size: 34px; line-height: 1.05; }
  .tag { font-family: "Space Mono", monospace; text-transform: lowercase; font-size: 12px; letter-spacing: .08em; color: var(--fog); }
  .tag::before { content: "✦ "; color: var(--glow); }
  p { line-height: 1.55; }
  .muted { color: var(--fog); font-weight: 500; }
  .center { text-align: center; align-items: center; }
  .grow { flex: 1; }

  /* the chakra buddies */
  .buddy { width: 168px; height: 168px; margin: 10px auto; display: block; overflow: visible; cursor: pointer;
    animation: bob 4.5s ease-in-out infinite; filter: drop-shadow(0 0 28px color-mix(in srgb, var(--glow) 45%, transparent)); }
  .buddy.small { width: 100px; height: 100px; }
  .buddy .eyes, .buddy .eye3 { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  .buddy .eye3 { animation-delay: 1.3s; }
  .buddy .zz text, .buddy .notes text { font-family: "Space Mono", monospace; font-weight: 700; fill: var(--chalk); }
  .buddy .zz text:nth-child(1), .buddy .notes text:nth-child(1) { animation: drift 3s ease-in-out infinite; }
  .buddy .zz text:nth-child(2), .buddy .notes text:nth-child(2) { animation: drift 3s ease-in-out 1.5s infinite; }
  .buddy .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 1.8s ease-in-out infinite; }
  .buddy .spark + .spark { animation-delay: .7s; }
  .buddy .rays { transform-origin: 60px 64px; animation: spin 14s linear infinite; }
  .buddy .boing { transform-origin: 60px 22px; animation: boing 1.6s ease-in-out infinite; }
  .buddy .sway { transform-origin: 60px 22px; animation: boing 3s ease-in-out infinite; }
  .buddy .feet ellipse { transform-box: fill-box; transform-origin: center top; animation: tap 1.2s ease-in-out infinite; }
  .buddy .feet ellipse + ellipse { animation-delay: .6s; }
  .buddy.sleepy { animation-duration: 7s; filter: drop-shadow(0 0 14px color-mix(in srgb, var(--glow) 22%, transparent)); }
  .buddy.sleepy .feet ellipse, .buddy.sleepy .rays, .buddy.sleepy .boing { animation-play-state: paused; }
  .buddy.wake { animation: wake .9s cubic-bezier(.3,1.8,.5,1), bob 4.5s ease-in-out .9s infinite; }
  .buddy.boop { animation: boop .5s cubic-bezier(.3,1.8,.5,1); }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes drift { 0%,100% { opacity: 0; transform: translate(0,0); } 40% { opacity: 1; } 80% { opacity: 0; transform: translate(6px,-12px); } }
  @keyframes twinkle { 0%,100% { transform: scale(.6) rotate(0); opacity: .5; } 50% { transform: scale(1.1) rotate(20deg); opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes boing { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
  @keyframes tap { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes wake { 0% { transform: scale(.7) rotate(-10deg); } 60% { transform: scale(1.12) rotate(6deg); } 100% { transform: scale(1); } }
  @keyframes boop { 0% { transform: scale(1); } 30% { transform: scale(1.18, .82); } 60% { transform: scale(.9, 1.12); } 100% { transform: scale(1); } }

  /* welcome lineup: a sleepy rainbow */
  .lineup { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: 0 0 18px; height: 110px; }
  .lineup .buddy { width: 46px; height: 46px; margin: 0; flex: none; }
  .lineup .buddy:nth-child(1), .lineup .buddy:nth-child(7) { margin-bottom: 0; }
  .lineup .buddy:nth-child(2), .lineup .buddy:nth-child(6) { margin-bottom: 26px; }
  .lineup .buddy:nth-child(3), .lineup .buddy:nth-child(5) { margin-bottom: 44px; }
  .lineup .buddy:nth-child(4) { margin-bottom: 52px; }
  .lineup .buddy:nth-child(even) { animation-delay: -2s; }
  .lineup .buddy:nth-child(3n) { animation-delay: -3.5s; }

  /* speech bubble */
  .bubble { position: relative; display: inline-block; background: var(--chalk); color: var(--ink); font-family: "Grandstander", sans-serif;
    font-weight: 800; font-size: 16px; padding: 9px 16px; border-radius: 18px; transform: rotate(-3deg); margin-bottom: -4px;
    box-shadow: 3px 3px 0 var(--glow); animation: say .5s cubic-bezier(.3,1.8,.5,1) .5s both; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; border: 10px solid transparent; border-top-color: var(--chalk); border-bottom: 0; transform: translateX(-30%); }
  .bubble:empty { display: none; }
  @keyframes say { from { opacity: 0; transform: scale(.4) rotate(-12deg); } to { opacity: 1; transform: rotate(-3deg); } }

  /* particles */
  .fx { position: fixed; z-index: 9; pointer-events: none; font-family: "Grandstander", sans-serif; font-weight: 800; line-height: 1; }

  /* chain of 7 */
  .chain { display: flex; justify-content: center; gap: 9px; margin: 2px 0 6px; }
  .chain i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--c); opacity: .4; transition: all .5s; }
  .chain i.now { opacity: 1; transform: scale(1.25); }
  .chain i.open { background: var(--c); opacity: 1; box-shadow: 0 0 10px var(--c); }

  /* sticker buttons */
  button { font: inherit; cursor: pointer; border: 0; color: inherit; }
  button:focus-visible, .buddy:focus-visible { outline: 3px dashed var(--glow); outline-offset: 4px; }
  .btn { width: 100%; padding: 15px; border-radius: 999px; font-family: "Grandstander", sans-serif; font-size: 19px; font-weight: 800;
    color: var(--ink); background: var(--chalk); border: 2.5px solid var(--chalk);
    box-shadow: 4px 5px 0 var(--glow); transition: transform .12s, box-shadow .12s; }
  .btn:hover { animation: jiggle .4s ease-in-out; }
  .btn:active { transform: translate(3px, 4px); box-shadow: 1px 1px 0 var(--glow); }
  .btn.ghost { background: var(--ink); color: var(--chalk); font-size: 16px; box-shadow: 3px 4px 0 var(--line); }
  .btn.ghost:active { box-shadow: 0 0 0 var(--line); }
  @keyframes jiggle { 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .link { background: none; color: var(--fog); font-size: 14px; padding: 12px; text-decoration: underline wavy; text-underline-offset: 5px; text-decoration-color: var(--glow); }

  .choice { display: grid; gap: 16px; margin-top: 24px; }
  .choice button { text-align: left; padding: 20px 22px; border-radius: 24px; background: var(--soot);
    border: 2.5px solid var(--chalk); box-shadow: 5px 6px 0 var(--glow); transition: transform .12s, box-shadow .12s; }
  .choice button:nth-child(1) { transform: rotate(-1.2deg); }
  .choice button:nth-child(2) { transform: rotate(1deg); }
  .choice button:active { transform: translate(3px,4px); box-shadow: 1px 1px 0 var(--glow); }
  .choice b { display: flex; align-items: center; gap: 10px; font-family: "Grandstander", sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 4px; }
  .choice b em { font-style: normal; font-size: 22px; display: inline-block; animation: twinkle 2.4s ease-in-out infinite; }
  .choice span { color: var(--fog); font-size: 15px; font-weight: 500; }

  .card { position: relative; margin: 58px 4px 22px; padding: 34px 24px 26px; border-radius: 28px; background: var(--soot);
    border: 2.5px solid var(--chalk); box-shadow: 7px 8px 0 var(--glow); transform: rotate(-1deg); }
  .card::before { content: ""; position: absolute; top: -13px; left: 18%; width: 70px; height: 24px; transform: rotate(-4deg);
    background: color-mix(in srgb, var(--glow) 55%, transparent); border-radius: 3px; } /* washi tape */
  .card .sitter { position: absolute; top: -60px; right: 16px; }
  .card .sitter .buddy { width: 70px; height: 70px; margin: 0; }
  .card .text { font-size: 24px; line-height: 1.35; font-weight: 700; }
  .timer { margin-top: 22px; display: flex; align-items: center; gap: 14px; }
  .timer .t { font-family: "Space Mono", monospace; font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; min-width: 62px; }
  .timer button { padding: 9px 18px; border-radius: 999px; background: var(--chalk); color: var(--ink); font-weight: 700; box-shadow: 2px 3px 0 var(--glow); }
  .bar { position: relative; height: 12px; border-radius: 12px; border: 2px solid var(--chalk); overflow: hidden; flex: 1; }
  .bar > div { height: 100%; width: 0; transition: width 1s linear;
    background: repeating-linear-gradient(-45deg, var(--glow) 0 6px, color-mix(in srgb, var(--glow) 60%, #fff) 6px 12px); }

  .ending { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin: 22px 0 8px; }
  .ending div { text-align: center; font-family: "Space Mono", monospace; font-size: 9.5px; color: var(--fog); text-transform: lowercase; }
  .ending .buddy { width: 100%; height: auto; margin: 0 0 6px; animation: none; filter: none; }
  .ending .open .buddy { animation: bob 3.5s ease-in-out infinite; }
  .ending .open:nth-child(even) .buddy { animation-delay: -1.7s; }
  .ending .open { color: var(--chalk); }

  footer { text-align: center; font-family: "Space Mono", monospace; font-size: 10.5px; color: var(--fog); opacity: .65; margin-top: 18px; line-height: 1.5; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<canvas id="stars"></canvas>
<svg class="moon" viewBox="0 0 40 40" aria-hidden="true"><path d="M27 4a16 16 0 1 0 9 26A13 13 0 0 1 27 4z" fill="#f7f1ff"/><path d="M14 21q2 2 4 0M22 24q2 2 4 0" stroke="#0d0b10" stroke-width="1.6" fill="none" stroke-linecap="round"/><ellipse cx="13" cy="26" rx="2.4" ry="1.4" fill="#ff8fc0"/><path d="M18 29q2.5 1.6 5 0" stroke="#0d0b10" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
<main>

  <!-- welcome -->
  <section class="screen on center" id="s-welcome">
    <div class="grow"></div>
    <div class="lineup" id="w-line"></div>
    <p class="tag">a tiny night ritual</p>
    <h1 id="title">Chakras</h1>
    <p class="muted" style="max-width:310px">Seven sleepy chakras, root to crown. Finish a card to wake each one up. (Psst: you can boop them.)</p>
    <div class="grow"></div>
    <button class="btn" id="begin" style="margin-top:24px">Start the journey</button>
    <button class="link" id="resume" hidden>Continue where you left off</button>
  </section>

  <!-- chakra intro -->
  <section class="screen center" id="s-intro">
    <div class="chain" id="chain1"></div>
    <div class="grow"></div>
    <p class="tag" id="i-n"></p>
    <div id="i-buddy"></div>
    <h2 id="i-name"></h2>
    <p class="muted" style="margin:4px 0 0;font-family:'Space Mono',monospace;font-size:14px" id="i-sk"></p>
    <p id="i-theme" style="margin:14px 0 0;font-weight:700"></p>
    <p class="muted" id="i-intro" style="max-width:330px"></p>
    <div class="grow"></div>
    <button class="btn" id="ready">I'm ready</button>
  </section>

  <!-- pick -->
  <section class="screen" id="s-pick">
    <div class="chain" id="chain2"></div>
    <div class="grow"></div>
    <div id="p-buddy"></div>
    <h2 style="text-align:center">What do you need?</h2>
    <div class="choice">
      <button id="pick-reflect"><b><em>☾</em>Reflect</b><span>A question to answer from the heart.</span></button>
      <button id="pick-practice"><b><em>✦</em>Practice</b><span>Breath, movement, kind words, a little ritual.</span></button>
    </div>
    <div class="grow"></div>
  </section>

  <!-- card -->
  <section class="screen" id="s-card">
    <div class="chain" id="chain3"></div>
    <div class="grow"></div>
    <p class="tag" id="c-meta" style="text-align:center;margin-bottom:0"></p>
    <div class="card">
      <div class="sitter" id="c-buddy"></div>
      <div class="text" id="c-text"></div>
      <div class="timer" id="c-timer" hidden>
        <div class="t" id="c-t"></div>
        <div class="bar"><div id="c-bar"></div></div>
        <button id="c-start">Start</button>
      </div>
    </div>
    <div class="grow"></div>
    <button class="btn" id="done">Done</button>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="swap">Another card</button>
      <button class="btn ghost" id="skip">Not this one</button>
    </div>
  </section>

  <!-- chakra result -->
  <section class="screen center" id="s-result">
    <div class="grow"></div>
    <div class="bubble" id="r-say"></div>
    <div id="r-buddy"></div>
    <h2 id="r-title"></h2>
    <p class="muted" id="r-sub" style="max-width:310px"></p>
    <div class="grow"></div>
    <button class="btn" id="next">Onward</button>
    <button class="btn ghost" id="more" style="margin-top:14px">One more card here</button>
  </section>

  <!-- end -->
  <section class="screen center" id="s-end">
    <div class="grow"></div>
    <p class="tag">journey complete</p>
    <h2 id="e-title"></h2>
    <div class="ending" id="e-chain"></div>
    <p class="muted" id="e-sub" style="max-width:330px"></p>
    <div class="grow"></div>
    <button class="btn" id="again">Journey again</button>
  </section>

  <footer>chakras come from the yoga + tantra traditions of india.<br>a reflection game, not medical advice.</footer>
</main>

<script src="cards.js"></script>
<script>
const CHAKRAS = window.CHAKRAS;
const $ = (id) => document.getElementById(id);
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const pickOne = (a) => a[Math.floor(Math.random() * a.length)];

let S = null; // { step: chakra index, opened: [bool x7], used: {}, card }
const ch = () => CHAKRAS[S.step];
const shuffle = (a) => a.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map((p) => p[1]);

// what each buddy says when it wakes up
const SAYS = {
  root: ["i feel so grounded ♡", "home sweet home", "rooted and cozy"],
  sacral: ["wheee!!", "party time ♪", "let's play!!"],
  solar: ["i am unstoppable", "look at me shine ☀", "we did that!"],
  heart: ["love u lots ♡", "my heart is so full", "hug? hug."],
  throat: ["la la laaa ♪", "i have things to say!", "loud and proud"],
  thirdeye: ["i saw this coming ✧", "everything's so clear", "ooh, a vision"],
  crown: ["everything is connected…", "so much peace ♡", "i feel whole"],
};

// ---------- the chakra buddy ----------
const INK = "#0d0b10", CHALK = "#f7f1ff", BLUSH = "#ff8fc0", GOLD = "#ffdc5e";
const RAYS = Array.from({ length: 10 }, (_, i) => {
  const a = (i / 10) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
  return `M${60 + c * 52} ${64 + s * 52}L${60 + c * 62} ${64 + s * 62}`;
}).join("");

function accessory(id, awake) {
  switch (id) {
    case "root": return { back: `<g class="sway"><path d="M60 22V8" stroke="${CHALK}" stroke-width="3" stroke-linecap="round"/>
      <path d="M60 13c-3-9-15-10-19-3 5 5 14 6 19 3z" fill="#6ee7a8" stroke="${CHALK}" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M60 10c3-9 15-10 19-3-5 5-14 6-19 3z" fill="#6ee7a8" stroke="${CHALK}" stroke-width="2.5" stroke-linejoin="round"/></g>` };
    case "sacral": return { front: `<g transform="rotate(16 60 24)"><path d="M45 27L60 -6L75 27z" fill="${BLUSH}" stroke="${CHALK}" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="58" cy="10" r="2.4" fill="${CHALK}"/><circle cx="64" cy="18" r="2.4" fill="${CHALK}"/><circle cx="54" cy="21" r="2.4" fill="${CHALK}"/>
      <circle cx="60" cy="-8" r="5.5" fill="${GOLD}" stroke="${CHALK}" stroke-width="2.5"/></g>` };
    case "solar": return { back: `<path class="rays" d="${RAYS}" stroke="${CHALK}" stroke-width="4" stroke-linecap="round"/>` };
    case "heart": return { back: `<g class="boing"><path d="M60 22q-6-8 0-16" stroke="${CHALK}" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M60 10c-10-6-9-15-3-15 2 0 3 1 3 3 0-2 1-3 3-3 6 0 7 9-3 15z" fill="${BLUSH}" stroke="${CHALK}" stroke-width="2.5" stroke-linejoin="round"/></g>` };
    case "throat": return { front: `<path d="M48 90l12 6-12 6zM72 90l-12 6 12 6z" fill="#3f8fe0" stroke="${CHALK}" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="60" cy="96" r="3.5" fill="${CHALK}"/>` + (awake ? `<g class="notes"><text x="104" y="42" font-size="18">♪</text><text x="0" y="52" font-size="15">♫</text></g>` : "") };
    case "thirdeye": return { front: awake
      ? `<g class="eye3"><path d="M50 40q10-9 20 0q-10 9-20 0z" fill="${CHALK}" stroke="${INK}" stroke-width="2"/><circle cx="60" cy="40" r="3.6" fill="${INK}"/><circle cx="61.4" cy="38.6" r="1.2" fill="#fff"/></g>`
      : `<path d="M51 39q9 6 18 0M54 42l-1 3M60 43v3M66 42l1 3" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>` };
    case "crown": return { front: `<path d="M44 27L41 6L52 15L60 1L68 15L79 6L76 27z" fill="${GOLD}" stroke="${CHALK}" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="60" cy="19" r="3" fill="${BLUSH}"/><circle cx="50" cy="21" r="2" fill="${CHALK}"/><circle cx="70" cy="21" r="2" fill="${CHALK}"/>` };
    default: return { back: `<path d="M60 22q-6-6 0-12q5-4 8 1" stroke="${CHALK}" stroke-width="3" fill="none" stroke-linecap="round"/>` };
  }
}

function buddy(c, mood, cls = "") {
  const awake = mood !== "sleep", acc = accessory(c.id, awake), color = c.color;
  const face = awake
    ? `<g class="eyes"><ellipse cx="46" cy="62" rx="5.5" ry="7.5" fill="${INK}"/><ellipse cx="74" cy="62" rx="5.5" ry="7.5" fill="${INK}"/>
       <circle cx="48" cy="59" r="2.2" fill="#fff"/><circle cx="76" cy="59" r="2.2" fill="#fff"/></g>
       <path d="M53 75q7 7 14 0" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
       <ellipse cx="35" cy="74" rx="7" ry="4" fill="${BLUSH}" opacity=".85"/><ellipse cx="85" cy="74" rx="7" ry="4" fill="${BLUSH}" opacity=".85"/>
       <path class="spark" d="M104 18l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="${CHALK}"/>
       <path class="spark" d="M14 28l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="${color}"/>`
    : `<path d="M40 64q6 6 12 0M68 64q6 6 12 0" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
       <ellipse cx="60" cy="79" rx="3" ry="3.6" fill="${INK}"/>
       <ellipse cx="35" cy="74" rx="6" ry="3.4" fill="${BLUSH}" opacity=".5"/><ellipse cx="85" cy="74" rx="6" ry="3.4" fill="${BLUSH}" opacity=".5"/>
       <g class="zz"><text x="100" y="34" font-size="15">z</text><text x="110" y="20" font-size="11">z</text></g>`;
  const label = `${c.name || "a"} chakra, ${awake ? "awake" : "asleep"}. Tap to boop.`;
  return `<svg class="buddy ${awake ? "" : "sleepy"} ${cls}" data-id="${c.id || ""}" data-cls="${cls}" data-mood="${mood}"
      viewBox="0 0 120 120" role="button" tabindex="0" aria-label="${label}">
    ${acc.back || ""}
    <g class="feet"><ellipse cx="44" cy="106" rx="10" ry="7" fill="${color}" stroke="${CHALK}" stroke-width="3"/>
      <ellipse cx="76" cy="106" rx="10" ry="7" fill="${color}" stroke="${CHALK}" stroke-width="3"/></g>
    <circle cx="60" cy="64" r="44" fill="${color}" stroke="${CHALK}" stroke-width="3.5"/>
    <ellipse cx="42" cy="42" rx="11" ry="6" fill="#fff" opacity=".45" transform="rotate(-32 42 42)"/>
    ${face}${acc.front || ""}</svg>`;
}
const chakraById = (id) => CHAKRAS.find((c) => c.id === id) || { id: "", color: "#b69cff", name: "" };

// ---------- particles ----------
function burst(el, { n = 12, glyphs = ["✦", "♡", "✧", "★", "☾"], spread = 120, up = 0, colors } = {}) {
  if (still || !el) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const pal = colors || [CHALK, BLUSH, GOLD, getComputedStyle(document.documentElement).getPropertyValue("--glow").trim()];
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "fx"; s.textContent = pickOne(glyphs);
    s.style.left = cx + "px"; s.style.top = cy + "px"; s.style.color = pickOne(pal);
    s.style.fontSize = 12 + Math.random() * 16 + "px";
    document.body.appendChild(s);
    const a = up ? -Math.PI / 2 + (Math.random() - .5) * 1.4 : Math.random() * Math.PI * 2;
    const d = spread * (.5 + Math.random() * .7);
    s.animate([
      { transform: "translate(-50%,-50%) scale(.3)", opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d}px)) scale(1) rotate(${(Math.random() - .5) * 120}deg)`, opacity: 1, offset: .7 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d + 20}px)) scale(.8)`, opacity: 0 },
    ], { duration: 1100 + Math.random() * 500, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => s.remove();
  }
}

// boop any buddy: awake ones squish + puff hearts, sleepy ones peek awake for a moment
function boop(el) {
  if (el.dataset.peeking) return;
  const c = chakraById(el.dataset.id), cls = el.dataset.cls || "";
  if (el.dataset.mood === "sleep") {
    const tmp = document.createElement("div");
    tmp.innerHTML = buddy(c, "awake", cls + " boop");
    const awake = tmp.firstElementChild; awake.dataset.peeking = "1";
    el.replaceWith(awake); burst(awake, { n: 5, glyphs: ["!", "✧", "?"], spread: 60, up: 1 });
    setTimeout(() => { tmp.innerHTML = buddy(c, "sleep", cls); awake.replaceWith(tmp.firstElementChild); }, 1600);
  } else {
    el.classList.remove("boop"); void el.getBoundingClientRect(); el.classList.add("boop");
    setTimeout(() => el.classList.remove("boop"), 520);
    burst(el, { n: 6, glyphs: ["♡", "♡", "✧"], spread: 80, up: 1 });
  }
}
document.addEventListener("click", (e) => { const b = e.target.closest(".buddy"); if (b) boop(b); });
document.addEventListener("keydown", (e) => {
  const b = e.target.closest?.(".buddy"); if (b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); boop(b); }
});

// ---------- game ----------
function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
  window.scrollTo(0, 0);
}
function setGlow(color) { document.documentElement.style.setProperty("--glow", color || "#b69cff"); }
function save() { store.set("cj.solo", S); }

function drawChain(el) {
  el.innerHTML = CHAKRAS.map((c, i) => {
    const cls = S.opened[i] ? "open" : i === S.step ? "now" : "";
    return `<i class="${cls}" style="--c:${c.color}" title="${c.name}"></i>`;
  }).join("");
}
const moodNow = () => (S.opened[S.step] ? "awake" : "sleep");

function startIntro() {
  const c = ch(); setGlow(c.color); drawChain($("chain1"));
  $("i-n").textContent = `chakra ${S.step + 1} of 7`;
  $("i-buddy").innerHTML = buddy(c, moodNow());
  $("i-name").textContent = c.name;
  $("i-sk").textContent = c.sanskrit;
  $("i-theme").textContent = c.theme;
  $("i-intro").textContent = c.intro;
  S.card = null; save(); show("s-intro");
}

function startPick() {
  const c = ch(); setGlow(c.color); drawChain($("chain2"));
  $("p-buddy").innerHTML = buddy(c, moodNow(), "small");
  S.card = null; save(); show("s-pick");
}

function draw(type, avoid) {
  const c = ch(), key = c.id + ":" + type;
  const all = c[type].map((x, i) => ({ i, ...(typeof x === "string" ? { text: x } : x) }));
  const used = S.used[key] || [];
  let pool = all.filter((x) => !used.includes(x.i) && x.i !== avoid);
  if (!pool.length) { S.used[key] = []; pool = all.filter((x) => x.i !== avoid); }
  const pick = shuffle(pool)[0];
  S.used[key] = [...(S.used[key] || []), pick.i];
  S.card = { type, ...pick }; save(); renderCard();
}

let tick = null;
function stopTimer() { clearInterval(tick); tick = null; }
function renderCard() {
  stopTimer();
  const c = ch(), k = S.card; setGlow(c.color); drawChain($("chain3"));
  $("c-meta").textContent = `${c.name} · ${k.type === "reflect" ? "reflect" : "practice"}`;
  $("c-buddy").innerHTML = buddy(c, moodNow());
  $("c-text").textContent = k.text;
  $("c-timer").hidden = !k.seconds;
  if (k.seconds) {
    $("c-t").textContent = fmt(k.seconds); $("c-bar").style.width = "0";
    $("c-start").textContent = "Start";
  }
  show("s-card");
}
const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
$("c-start").onclick = () => {
  const total = S.card.seconds; let left = total;
  if (tick) { stopTimer(); $("c-start").textContent = "Start"; $("c-t").textContent = fmt(total); $("c-bar").style.width = "0"; return; }
  $("c-start").textContent = "Reset";
  tick = setInterval(() => {
    left -= 1; $("c-t").textContent = fmt(Math.max(0, left));
    $("c-bar").style.width = `${100 * (total - left) / total}%`;
    if (left <= 0) {
      stopTimer(); $("c-start").textContent = "Again"; navigator.vibrate?.([120, 80, 120]);
      $("c-buddy").innerHTML = buddy(ch(), "awake", "wake");
      burst($("c-buddy"), { n: 10, spread: 90 });
    }
  }, 1000);
};

function finishCard(completed) {
  stopTimer();
  const c = ch(), wasOpen = S.opened[S.step];
  if (completed) S.opened[S.step] = true;
  S.card = null; save();
  const open = S.opened[S.step], fresh = open && !wasOpen;
  setGlow(c.color);
  $("r-buddy").innerHTML = buddy(c, open ? "awake" : "sleep", fresh ? "wake" : "");
  $("r-say").textContent = open ? (wasOpen ? "even more?? ♡" : pickOne(SAYS[c.id] || ["hi!!"])) : "five more minutes…";
  $("r-say").style.animation = "none"; void $("r-say").offsetWidth; $("r-say").style.animation = "";
  $("r-title").textContent = open ? (wasOpen ? `${c.name} is glowing brighter` : `${c.name} is awake!`) : `${c.name} is still snoozing`;
  $("r-sub").textContent = open ? c.theme + "." : "That's okay. Try another card, or let it rest until next time.";
  $("next").textContent = S.step >= CHAKRAS.length - 1 ? "See your journey" : "Onward";
  show("s-result");
  if (open) setTimeout(() => burst($("r-buddy").firstElementChild, { n: fresh ? 18 : 8, spread: fresh ? 150 : 90 }), 250);
}

function showEnd() {
  setGlow("#d9b8ff");
  const n = S.opened.filter(Boolean).length;
  $("e-title").textContent = n === 7 ? "All seven, wide awake" : `${n} of 7 awake`;
  $("e-chain").innerHTML = CHAKRAS.map((c, i) =>
    `<div class="${S.opened[i] ? "open" : ""}">${buddy(c, S.opened[i] ? "awake" : "sleep")}${c.name.replace(" Plexus", "")}</div>`).join("");
  $("e-sub").textContent = n === 7
    ? "Root to crown. Be soft with yourself tonight, you earned it."
    : "Every step counts. The sleepy ones will wake in their own time.";
  store.del("cj.solo"); show("s-end");
  if (n) {
    const all = [...$("e-chain").querySelectorAll(".open .buddy")];
    all.forEach((b, i) => setTimeout(() => burst(b, { n: 5, spread: 60 }), 300 + i * 180));
  }
}

// ---------- wiring ----------
$("title").innerHTML = [..."Chakras"].map((l, i) => `<span style="--i:${i}">${l}</span>`).join("");
$("w-line").innerHTML = CHAKRAS.map((c) => buddy(c, "sleep")).join("");
const saved = store.get("cj.solo");
if (saved && Array.isArray(saved.opened) && typeof saved.step === "number") $("resume").hidden = false;

$("begin").onclick = () => {
  S = { step: 0, opened: CHAKRAS.map(() => false), used: {}, card: null };
  startIntro();
};
$("resume").onclick = () => { S = saved; S.card ? renderCard() : startIntro(); };
$("ready").onclick = startPick;
$("pick-reflect").onclick = () => draw("reflect");
$("pick-practice").onclick = () => draw("practice");
$("swap").onclick = () => draw(S.card.type, S.card.i);
$("done").onclick = () => finishCard(true);
$("skip").onclick = () => finishCard(false);
$("more").onclick = startPick;
$("next").onclick = () => {
  if (S.step >= CHAKRAS.length - 1) return showEnd();
  S.step += 1; startIntro();
};
$("again").onclick = () => { $("resume").hidden = true; setGlow(); show("s-welcome"); };

// ---------- starfield: dots, sparkles, and the odd shooting star ----------
(() => {
  const cv = $("stars"), x = cv.getContext("2d");
  const tints = ["#f7f1ff", "#f7f1ff", "#f7f1ff", "#ff8fc0", "#b69cff", "#7fd4ff"];
  let stars = [], w, h, d, shoot = null;
  function size() {
    d = devicePixelRatio || 1;
    w = cv.width = innerWidth * d; h = cv.height = innerHeight * d;
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
    stars = Array.from({ length: 110 }, (_, i) => ({
      x: Math.random() * w, y: Math.random() * h, p: Math.random() * 6.28, s: Math.random() * .02 + .005,
      sparkle: i % 9 === 0, r: i % 9 === 0 ? Math.random() * 3 + 3 : Math.random() * 1.3 + .3,
      c: tints[Math.floor(Math.random() * tints.length)],
    }));
  }
  function sparkle(cx, cy, r) {
    x.beginPath(); x.moveTo(cx, cy - r);
    x.quadraticCurveTo(cx, cy, cx + r, cy); x.quadraticCurveTo(cx, cy, cx, cy + r);
    x.quadraticCurveTo(cx, cy, cx - r, cy); x.quadraticCurveTo(cx, cy, cx, cy - r); x.fill();
  }
  function frame() {
    x.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.p += s.s; const a = .3 + .7 * (still ? .6 : (Math.sin(s.p) + 1) / 2);
      x.globalAlpha = a; x.fillStyle = s.c;
      if (s.sparkle) sparkle(s.x, s.y, s.r * d);
      else { x.beginPath(); x.arc(s.x, s.y, s.r * d, 0, 6.28); x.fill(); }
    }
    if (!still) {
      if (!shoot && Math.random() < .004) shoot = { x: w * (.3 + Math.random() * .7), y: h * Math.random() * .4, life: 1 };
      if (shoot) {
        const vx = -9 * d, vy = 4.5 * d, tx = shoot.x - vx * 10, ty = shoot.y - vy * 10;
        const g = x.createLinearGradient(shoot.x, shoot.y, tx, ty);
        g.addColorStop(0, "rgba(247,241,255,1)"); g.addColorStop(1, "rgba(247,241,255,0)");
        x.globalAlpha = shoot.life; x.strokeStyle = g; x.lineWidth = 2 * d; x.lineCap = "round";
        x.beginPath(); x.moveTo(shoot.x, shoot.y); x.lineTo(tx, ty); x.stroke();
        x.fillStyle = "#f7f1ff"; sparkle(shoot.x, shoot.y, 5 * d);
        shoot.x += vx; shoot.y += vy; shoot.life -= .018;
        if (shoot.life <= 0) shoot = null;
      }
      requestAnimationFrame(frame);
    }
  }
  addEventListener("resize", () => { size(); if (still) frame(); });
  size(); frame();
})();
</script>
</body>
